<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Healthie Icon">
  <defs>
    <linearGradient id="healthie-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="healthie-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Base -->
  <rect x="10" y="10" width="100" height="100" rx="30" fill="url(#healthie-icon-grad)" opacity="0.35" filter="url(#icon-glow)" />

  <!-- Main Rounded Rect -->
  <rect x="10" y="10" width="100" height="100" rx="30" fill="url(#healthie-icon-grad)" />
  <rect x="10" y="10" width="100" height="100" rx="30" fill="url(#healthie-shine)" />

  <!-- Health Shield Outline -->
  <path d="M60 30 C44 30 36 36 36 48 V66 C36 82 50 92 60 95 C70 92 84 82 84 66 V48 C84 36 76 30 60 30 Z" 
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cross -->
  <path d="M60 44 V72 M46 58 H74" 
        stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Spark Star -->
  <circle cx="86" cy="30" r="7" fill="#38bdf8" />
</svg>
